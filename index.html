<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tirador de Times da Pelada</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --green: #1db954;
    --green-dark: #158a3e;
    --green-glow: rgba(29,185,84,0.35);
    --grass: #0a1f0d;
    --grass2: #0d2610;
    --dirt: #1a1a1a;
    --card: #111;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --muted: #777;
    --yellow: #f5c518;
    --red: #e63946;
  }

  body {
    font-family: 'Barlow', sans-serif;
    background: var(--grass);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── FIELD LINES BACKGROUND ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 60px, rgba(255,255,255,0.025) 60px, rgba(255,255,255,0.025) 61px),
      repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(255,255,255,0.025) 60px, rgba(255,255,255,0.025) 61px);
    pointer-events: none;
    z-index: 0;
  }

  /* Center circle */
  body::after {
    content: '';
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 340px; height: 340px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.04);
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 680px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ── HEADER ── */
  .header {
    text-align: center;
    margin-bottom: 36px;
  }

  .header-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--green);
    color: #000;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 12px;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.4rem, 8vw, 4rem);
    line-height: 0.95;
    letter-spacing: 0.04em;
    color: #fff;
    text-shadow: 0 0 40px var(--green-glow);
    margin-bottom: 8px;
  }

  h1 span { color: var(--green); }

  .header-sub {
    font-size: 0.88rem;
    color: var(--muted);
  }

  /* ── CARD ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
  }

  .card-title {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--green);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ── PLAYER INPUT ── */
  .input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }

  .input-row input {
    flex: 1;
    background: #1a1a1a;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 16px;
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .input-row input:focus { border-color: var(--green); }
  .input-row input::placeholder { color: var(--muted); }

  .btn-add {
    background: var(--green);
    border: none;
    border-radius: 10px;
    width: 44px;
    height: 44px;
    cursor: pointer;
    font-size: 1.3rem;
    color: #000;
    font-weight: 700;
    flex-shrink: 0;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn-add:hover { background: #25d466; transform: scale(1.05); }
  .btn-add:active { transform: scale(0.97); }

  /* ── PLAYER TAGS ── */
  .players-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 44px;
  }

  .player-tag {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.85rem;
    font-weight: 600;
    animation: popIn 0.2s cubic-bezier(0.34,1.56,0.64,1);
    cursor: default;
  }

  @keyframes popIn {
    from { transform: scale(0.5); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }

  .player-tag .num {
    background: var(--green);
    color: #000;
    font-size: 0.65rem;
    font-weight: 700;
    width: 18px; height: 18px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }

  .player-tag .del {
    background: none; border: none; color: #555;
    cursor: pointer; font-size: 0.85rem; padding: 0;
    transition: color 0.15s; line-height: 1;
  }
  .player-tag .del:hover { color: var(--red); }

  .players-empty {
    width: 100%;
    color: var(--muted);
    font-size: 0.82rem;
    padding: 8px 0;
  }

  /* ── SETTINGS ── */
  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .setting-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
    min-width: 120px;
  }

  .setting-label {
    font-size: 0.72rem;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .counter {
    display: flex;
    align-items: center;
    gap: 0;
    background: #1a1a1a;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    width: fit-content;
  }

  .counter button {
    background: none; border: none;
    color: var(--green); font-size: 1.2rem;
    width: 38px; height: 38px;
    cursor: pointer; font-weight: 700;
    transition: background 0.15s;
  }
  .counter button:hover { background: #222; }

  .counter span {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    min-width: 40px;
    text-align: center;
    color: #fff;
  }

  /* ── MAIN BUTTON ── */
  .btn-sortear {
    width: 100%;
    background: var(--green);
    border: none;
    border-radius: 12px;
    padding: 15px;
    color: #000;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 4px 24px var(--green-glow);
  }

  .btn-sortear:hover {
    background: #25d466;
    box-shadow: 0 6px 32px rgba(29,185,84,0.5);
    transform: translateY(-1px);
  }
  .btn-sortear:active { transform: translateY(1px); }
  .btn-sortear:disabled { background: #333; color: #555; box-shadow: none; cursor: not-allowed; transform: none; }

  /* ── RESULTS ── */
  .results-section {
    display: none;
    animation: fadeUp 0.4s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .results-section.visible { display: block; }

  .results-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .results-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 0.06em;
    color: #fff;
  }

  .btn-limpar {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(230,57,70,0.12);
    border: 1px solid rgba(230,57,70,0.4);
    border-radius: 8px;
    padding: 7px 14px;
    color: var(--red);
    font-family: 'Barlow', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-limpar:hover { background: rgba(230,57,70,0.22); }

  .teams-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }

  .team-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  .team-header {
    padding: 12px 16px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 0.06em;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .team-emoji { font-size: 1.2rem; }

  .team-body {
    padding: 4px 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .team-player {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.88rem;
    padding: 5px 0;
    border-bottom: 1px solid #1a1a1a;
  }
  .team-player:last-child { border-bottom: none; }

  .player-icon { font-size: 0.75rem; opacity: 0.5; }

  .reserve-section {
    margin-top: 12px;
  }

  .reserve-label {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--yellow);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .reserve-card {
    background: var(--card);
    border: 1px solid #2a2500;
    border-radius: 14px;
    overflow: hidden;
  }

  .reserve-header {
    background: rgba(245,197,24,0.08);
    padding: 10px 16px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem;
    letter-spacing: 0.06em;
    color: var(--yellow);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .reserve-body {
    padding: 4px 16px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .reserve-player {
    font-size: 0.82rem;
    background: #1e1a00;
    border: 1px solid #3a3000;
    border-radius: 6px;
    padding: 4px 10px;
    color: var(--yellow);
  }

  /* ── MSG ── */
  .msg {
    text-align: center;
    padding: 12px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 14px;
    display: none;
  }
  .msg.error { background: rgba(230,57,70,0.12); border: 1px solid rgba(230,57,70,0.3); color: var(--red); display: block; }

  /* ── FOOTER ── */
  .footer {
    text-align: center;
    margin-top: 40px;
    font-size: 0.75rem;
    color: #333;
  }

  /* ── TEAM COLORS ── */
  .tc-0 { background: rgba(29,185,84,0.12); border-bottom: 2px solid var(--green); color: var(--green); }
  .tc-1 { background: rgba(99,102,241,0.12); border-bottom: 2px solid #6366f1; color: #818cf8; }
  .tc-2 { background: rgba(245,197,24,0.12); border-bottom: 2px solid var(--yellow); color: var(--yellow); }
  .tc-3 { background: rgba(230,57,70,0.12); border-bottom: 2px solid var(--red); color: var(--red); }
  .tc-4 { background: rgba(251,146,60,0.12); border-bottom: 2px solid #fb923c; color: #fb923c; }
  .tc-5 { background: rgba(56,226,196,0.12); border-bottom: 2px solid #38e2c4; color: #38e2c4; }
  .tc-6 { background: rgba(236,72,153,0.12); border-bottom: 2px solid #ec4899; color: #ec4899; }
  .tc-7 { background: rgba(168,85,247,0.12); border-bottom: 2px solid #a855f7; color: #a855f7; }

  .tc-border-0 { border-color: rgba(29,185,84,0.25); }
  .tc-border-1 { border-color: rgba(99,102,241,0.25); }
  .tc-border-2 { border-color: rgba(245,197,24,0.25); }
  .tc-border-3 { border-color: rgba(230,57,70,0.25); }
  .tc-border-4 { border-color: rgba(251,146,60,0.25); }
  .tc-border-5 { border-color: rgba(56,226,196,0.25); }
  .tc-border-6 { border-color: rgba(236,72,153,0.25); }
  .tc-border-7 { border-color: rgba(168,85,247,0.25); }

  @media (max-width: 480px) {
    .teams-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="wrapper">

  <!-- HEADER -->
  <div class="header">
    <div class="header-badge">⚽ Pelada</div>
    <h1>Tirador de<br><span>Times</span> da Pelada</h1>
    <div class="header-sub">Adicione os jogadores e sorteie os times na hora!</div>
  </div>

  <!-- PLAYERS CARD -->
  <div class="card">
    <div class="card-title">⚽ Jogadores</div>
    <div class="input-row">
      <input type="text" id="player-input" placeholder="Nome do jogador..." maxlength="30" autocomplete="off">
      <button class="btn-add" onclick="addPlayer()" title="Adicionar">+</button>
    </div>
    <div class="players-wrap" id="players-wrap">
      <div class="players-empty" id="players-empty">Nenhum jogador adicionado ainda.</div>
    </div>
  </div>

  <!-- SETTINGS CARD -->
  <div class="card">
    <div class="card-title">⚙️ Configurações</div>
    <div class="settings-row">
      <div class="setting-group">
        <div class="setting-label">Número de times</div>
        <div class="counter">
          <button onclick="changeTeams(-1)">−</button>
          <span id="teams-count">2</span>
          <button onclick="changeTeams(1)">+</button>
        </div>
      </div>
      <div class="setting-group" style="align-items:flex-end">
        <div class="setting-label" style="text-align:right">Total de jogadores</div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--green);line-height:1" id="player-count-display">0</div>
      </div>
    </div>
  </div>

  <!-- ERROR MSG -->
  <div class="msg" id="error-msg"></div>

  <!-- SORTEAR BUTTON -->
  <button class="btn-sortear" id="btn-sortear" onclick="sortear()">
    ⚽ SORTEAR TIMES
  </button>

  <!-- RESULTS -->
  <div class="results-section" id="results-section" style="margin-top:28px">
    <div class="results-header">
      <div class="results-title">🏆 Times Sorteados</div>
      <button class="btn-limpar" onclick="limparTimes()">
        🗑 Apagar Times
      </button>
    </div>
    <div class="teams-grid" id="teams-grid"></div>
    <div id="reserve-section"></div>
  </div>

  <div class="footer">feito pra jogar, não pra brigar quem fica com quem ⚽</div>
</div>

<script>
  let players = [];
  let numTeams = 2;

  const teamEmojis = ['🟢','🔵','🟡','🔴','🟠','🩵','🩷','🟣'];
  const teamNames = ['Time A','Time B','Time C','Time D','Time E','Time F','Time G','Time H'];

  const playerInput = document.getElementById('player-input');
  const playersWrap = document.getElementById('players-wrap');
  const playersEmpty = document.getElementById('players-empty');
  const teamsCountEl = document.getElementById('teams-count');
  const playerCountDisplay = document.getElementById('player-count-display');
  const resultsSection = document.getElementById('results-section');
  const teamsGrid = document.getElementById('teams-grid');
  const errorMsg = document.getElementById('error-msg');

  playerInput.addEventListener('keydown', e => { if (e.key === 'Enter') addPlayer(); });

  function addPlayer() {
    const name = playerInput.value.trim();
    if (!name) return;
    if (players.includes(name)) { showError(`"${name}" já foi adicionado!`); return; }
    players.push(name);
    playerInput.value = '';
    playerInput.focus();
    hideError();
    renderPlayers();
  }

  function removePlayer(name) {
    players = players.filter(p => p !== name);
    renderPlayers();
  }

  function renderPlayers() {
    playerCountDisplay.textContent = players.length;
    if (!players.length) {
      playersWrap.innerHTML = '<div class="players-empty" id="players-empty">Nenhum jogador adicionado ainda.</div>';
      return;
    }
    playersWrap.innerHTML = players.map((p, i) =>
      `<div class="player-tag">
        <span class="num">${i+1}</span>
        ${escHtml(p)}
        <button class="del" onclick="removePlayer('${escHtml(p)}')" title="Remover">✕</button>
      </div>`
    ).join('');
  }

  function changeTeams(delta) {
    numTeams = Math.min(8, Math.max(2, numTeams + delta));
    teamsCountEl.textContent = numTeams;
  }

  function sortear() {
    hideError();
    if (players.length < 2) { showError('Adicione pelo menos 2 jogadores!'); return; }
    if (numTeams > players.length) { showError(`Você tem ${players.length} jogador(es) mas quer ${numTeams} times. Reduza os times ou adicione mais jogadores.`); return; }

    // Shuffle
    const shuffled = [...players].sort(() => Math.random() - 0.5);

    const perTeam = Math.floor(shuffled.length / numTeams);
    const remainder = shuffled.length % numTeams;

    const teams = [];
    let idx = 0;
    for (let i = 0; i < numTeams; i++) {
      const size = perTeam + (i < remainder ? 1 : 0);
      teams.push(shuffled.slice(idx, idx + size));
      idx += size;
    }

    renderTeams(teams);
    resultsSection.classList.add('visible');
    setTimeout(() => resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
  }

  function renderTeams(teams) {
    teamsGrid.innerHTML = teams.map((team, i) =>
      `<div class="team-card tc-border-${i % 8}" style="animation-delay:${i * 0.07}s">
        <div class="team-header tc-${i % 8}">
          <span class="team-emoji">${teamEmojis[i % 8]}</span>
          ${teamNames[i % 8]} <span style="font-size:0.75rem;opacity:0.7;margin-left:4px">(${team.length} jog.)</span>
        </div>
        <div class="team-body">
          ${team.map(p => `<div class="team-player"><span class="player-icon">▸</span>${escHtml(p)}</div>`).join('')}
        </div>
      </div>`
    ).join('');

    document.getElementById('reserve-section').innerHTML = '';
  }

  function limparTimes() {
    resultsSection.classList.remove('visible');
    teamsGrid.innerHTML = '';
    document.getElementById('reserve-section').innerHTML = '';
  }

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.className = 'msg error';
  }

  function hideError() {
    errorMsg.className = 'msg';
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
